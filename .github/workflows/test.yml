name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Verify native clipboard ownership
        if: runner.os == 'Windows'
        run: cargo test --locked clipboard::platform::windows_clipboard_moves_only_the_current_publication -- --ignored --exact
